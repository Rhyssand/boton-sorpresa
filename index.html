        :root {

            --btn-color: #d4af37;

           2. ESTILOS GENERALES Y ANIMACIÓN

            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

        @keyframes moverFondo {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 80%;
            width: 400px;
            z-index: 10;
            position: relative;
            backdrop-filter: blur(8px); /* Efecto vidrio esmerilado */

            color: var(--text-color);

            font-weight: 700;
            font-size: 2.8rem; 
            line-height: 1.2;

            color: #333;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            font-family: 'Segoe UI', sans-serif;
            width: 100%;
        }

        button:hover {
            background: var(--btn-hover);

        /* Elementos flotantes */

            position: absolute;
            bottom: -50px;

            z-index: 1;

        }

            0% { transform: translateY(0) rotate(0deg); opacity: 1; }

    </style>
</head>

        let activeArray = ["Falta agregar los mensajes en el código ❤️"]; 
        let currentIcon = "❤️"; 

        function inicializarAplicacion() {
            const now = new Date();
            const month = now.getMonth(); 
            const day = now.getDate();
            const hour = now.getHours();
            const minute = now.getMinutes();
            const timeStr = hour + (minute / 60); 

            const body = document.body;
            const titulo = document.getElementById("titulo");
            
            body.className = "";

            // REGLA 1: FECHAS ESPECIALES
            if (month === 11 && (day === 24 || day === 25)) {
                body.classList.add("theme-christmas");
                if(mensajesNavidad.length > 0) activeArray = mensajesNavidad;
                currentIcon = "❄️"; 
                titulo.innerText = "¡Feliz Navidad, \nMi Amor!";
            } 
            else if ((month === 11 && day === 31) || (month === 0 && day === 1)) {
                body.classList.add("theme-newyear");
                if(mensajesAñoNuevo.length > 0) activeArray = mensajesAñoNuevo;
                currentIcon = "✨";
                titulo.innerText = "¡Feliz Año Nuevo!";
            }
            else if (day === 25) {
                body.classList.add("theme-anniversary");
                if(mensajesAniversario.length > 0) activeArray = mensajesAniversario;
                currentIcon = "🍷"; 
                titulo.innerText = "¡Feliz Aniversario, \nMi Vida!";
            }
            // REGLA 2: EL DÍA A DÍA
            else {
                titulo.innerText = "Para mi niña hermosa";
                currentIcon = "❤️";
                
                if (timeStr >= 6 && timeStr < 17.5) {
                    body.classList.add("theme-day");
                    if(mensajesGenerales.length > 0) activeArray = mensajesGenerales;
                } 
                else if (timeStr >= 17.5 && timeStr < 19.5) {
                    body.classList.add("theme-sunset");
                    if(mensajesGenerales.length > 0) activeArray = mensajesGenerales;
                } 
                else {
                    body.classList.add("theme-night");
                    if(mensajesNoche.length > 0) activeArray = mensajesNoche;
                    currentIcon = "⭐"; 
                }
            }
        }

        function generarMensaje() {
            if (activeArray.length === 0) return;
            const randomIndex = Math.floor(Math.random() * activeArray.length);
            const mensajeDiv = document.getElementById("mensaje");
            
            mensajeDiv.style.opacity = 0;
            setTimeout(() => {
                mensajeDiv.innerText = activeArray[randomIndex];
                mensajeDiv.style.opacity = 1;
            }, 300);
        }

        function crearParticula() {
            const container = document.getElementById("floating-container");
            const part = document.createElement("div");
            part.classList.add("floating-item");
            part.innerText = currentIcon;
            
            part.style.left = Math.random() * 100 + "vw";
            part.style.fontSize = (Math.random() * 20 + 15) + "px";
            part.style.animationDuration = (Math.random() * 5 + 5) + "s";
            
            container.appendChild(part);
            
            setTimeout(() => {
                part.remove();
            }, 10000); // Se borran a los 10 segundos
        }

        // ==========================================
        // 5. ARRANQUE DEL SISTEMA
        // ==========================================
